decision_tree:
- resolve_asset_context
- derive_company_folder_and_asset_folder
- derive_type_metric_ss_from_asset
- validate_user_required_fields
- resolve_doc_type_route_entry
- if_mode_is_by_stage_validate_deliverable_stage_and_route
- if_mode_is_by_workstream_or_by_workstream_with_fallback_validate_workstream_and_route
- if_doc_type_is_FIN_or_CNT_apply_counterparty_naming_rule
- build_canonical_filename
- validate_constraints_against_master_policy
- emit_canonical_record_or_review_flag
route_output_contract:
  contract_ref: '#/canonical_record_contract'
  required_fields:
  - source_path
  - company_folder
  - asset_folder
  - type
  - metric
  - ss
  - workstream
  - phase
  - doc_type
  - target_folder_id
  - canonical_filename
  - metadata
  - confidence
  - requires_review
  - exception_class
confidence_policy:
  base_confidence: medium
  increase_when:
  - explicit_workstream_matches_doc_type_context
  - explicit_stage_present_for_stage_sensitive_doc_type
  - explicit_counterparty_present_for_FIN_or_CNT
  - target_folder_id_resolved_without_fallback
  decrease_when:
  - fallback_folder_id_was_used
  - stage_sensitive_doc_missing_stage
  - FIN_or_CNT_missing_counterparty
  - weak_generic_description
  - conflicting_path_or_content_signals
routing_integrity_checks:
- every_route_registry_key_must_exist_in_doc_type_catalog
- every_target_folder_id_must_exist_in_workstreams_or_special_folders
- every_stage_route_key_must_exist_in_enums_deliverable_stages
exception_classes:
  REVIEW_AMBIGUITY:
    description: Business meaning is unclear or route confidence is too low.
    default_target_selector: same_workstream_misc_review
  DUPLICATE_CONFLICT:
    description: Two or more exact-hash copies exist and keeper selection is required.
    default_target_folder_id: ASSET_SPECIAL_DUPLICATED
  ARCHIVE_OR_OBSOLETE:
    description: Superseded, cancelled, deprecated, or no-longer-live material.
    default_target_policy: move_to_special_or_company_archive
  LONG_PATH_TECHNICAL_EXCEPTION:
    description: Path cannot be made compliant through normal shortening rules.
    default_target_selector: same_workstream_misc_review
  NONCANONICAL_PLACEMENT:
    description: File sits in export, backup, temp, or other noncanonical location.
    default_target_policy: reroute_to_canonical_or_review
archive_rules:
  deprecated_or_temp_extensions:
  - .tmp
  - .bak
  - .old
  - .orig
  - .swp
  - .lock
  - .crdownload
  - .part
  - .dwl
  - .dwl2
  - .wbk
  review_before_archive_extensions:
  - .zip
  - .msg
  ignore_system_files:
  - Thumbs.db
  - .DS_Store
  - desktop.ini
  superseded_status_action:
    action: keep_in_place_or_move
    target_folder_id: ASSET_SPECIAL_SUPERSEDED
  duplicated_hash_action:
    action: review_then_move
    target_folder_id: ASSET_SPECIAL_DUPLICATED
  deprecated_material_action:
    action: move
    target_folder_id: ASSET_SPECIAL_DEPRECATED
  backup_material_action:
    action: move
    target_folder_id: ASSET_SPECIAL_BACKUP
  cancelled_asset_action:
    action: move_asset_folder_to_company_archive_by_year
normalization_policy:
  canonical_output_language: english
  canonical_output_script: latin
  description_rules:
  - lowercase_by_default
  - allow_uppercase_counterparty_or_authority_tokens_only
  - replace_spaces_with_hyphens
  - remove_junk_tokens_like_copy_final_new_scan
  - collapse_repeated_dashes
  - trim_trailing_dots_and_spaces
  - remove_forbidden_windows_chars
  fin_cnt_description_builder:
    single_counterparty: '{COUNTERPARTY}-{description}'
    dual_counterparty: '{COUNTERPARTY}-to-{OTHER_COUNTERPARTY}-{description}'
  transliteration:
    enabled: true
    note: Canonical filenames and folder names follow English/Latin normalized naming.
path_policy:
  source_of_truth_ref: '#/constraints'
  soft_limits:
    description_chars: 60
    project_name_chars: 40
    location_chars: 30
  shortening_order:
  - shorten_description
  - shorten_project_name
  - shorten_location
  - apply_standard_abbreviations
  - append_short_hash_suffix_if_needed
  - move_to_same_workstream_misc_review_if_still_too_long
  standard_abbreviations:
    agreement: agr
    application: appl
    construction: constr
    consultant: cons
    contractor: ctr
    correspondence: corr
    deliverable: dlv
    engineering: eng
    invoice: inv
    maintenance: maint
    operations: ops
    payment: pay
    procurement: proc
    submission: subm
    subcontractor: subc
  uniqueness:
    on_collision: add_-h{HASH6}_before_extension
review_policy:
  review_queue_targets:
    business_ambiguity:
      selector: same_workstream_misc_review
    duplicates:
      folder_id: ASSET_SPECIAL_DUPLICATED
    superseded:
      folder_id: ASSET_SPECIAL_SUPERSEDED
    deprecated:
      folder_id: ASSET_SPECIAL_DEPRECATED
    backup:
      folder_id: ASSET_SPECIAL_BACKUP
  review_triggers:
  - missing_required_user_input
  - fallback_route_used_with_low_context
  - conflicting_workstream_evidence
  - conflicting_doc_type_evidence
  - stage_sensitive_doc_without_stage
  - FIN_or_CNT_without_counterparty
  - keeper_candidate_exceeds_hard_limits
  - duplicate_group_has_multiple_strong_candidates
duplicate_keeper_logic:
  grouping_key: exact_file_hash
  activation_condition:
  - apply_only_when_two_or_more_files_share_exact_hash
  - ignore_singletons
  keeper_selection_priority:
  - prefer_files_already_in_valid_workstream_first_asset_structure
  - avoid_files_in_special_buckets_or_archive_or_99_EXPORTS
  - prefer_paths_with_stronger_business_context
  - prefer_filenames_closer_to_canonical_policy
  - prefer_stronger_text_or_preview_evidence
  - prefer_non_temp_non_system_files
  - use_newest_reliable_modified_date_only_as_late_tiebreaker
  - if_still_tied_choose_shortest_valid_canonical_path
  - if_still_tied_choose_deterministically_by_sorted_absolute_path
  special_path_penalties:
    folder_names:
    - _DUPLICATED
    - _BACKUP
    - _DEPRECATED
    - _SUPERSEDED
    - ARCHIVE
    - OLD
    - MISC
    - REVIEW
    - 99_EXPORTS
  keeper_output:
    duplicate_status: KEEPER
    duplicate_role: CANONICAL_COPY
  non_keeper_output:
    action: move_to_special_folder
    target_folder_id: ASSET_SPECIAL_DUPLICATED
    duplicate_status: NON_KEEPER
    duplicate_role: DUPLICATE_COPY
  review_resolution_rule:
  - if_confidence_is_insufficient_select_provisional_keeper
  - require_manual_review_before_moving_non_keepers
exports_policy:
  export_workstream_folder_id: WS_EXPORTS
  canonical_storage_allowed: false
  allowed_uses:
  - email_packs
  - portal_upload_sets
  - temporary_transmittal_bundles
  cleanup_rule: Temporary export sets should be deleted after sending unless there is a specific operational reason to retain
    them.
submission_case_policy:
  purpose: Clarify how submission workflows handle source files, export copies, and case records.
  rules:
  - Unchanged source files must remain in their canonical workstream folders and must not be permanently duplicated into submission
    case folders.
  - 99_EXPORTS is only a temporary outbox for portal upload sets, email packs, and transmittal bundles.
  - Temporary copies created inside 99_EXPORTS may be deleted after successful sending or upload.
  - WS_PMT_SUBMISSIONS_RESPONSES stores the case record of the submission process, including application forms, cover letters,
    manifests, submission receipts, acknowledgements, authority correspondence, clarification requests, and reply packages.
  - WS_PMT_SUBMISSIONS_RESPONSES may store submission-specific transformed derivatives of source files when needed, such as
    stamped, signed, frozen, redacted, authority-formatted, or submission-bundled versions.
  - Final issued permits, licences, or approvals must be stored in WS_PMT_PERMITS_LICENSES according to the PER route.
  examples:
  - A source DWG remains in WS_TDE_DRAWINGS; only the upload copy goes temporarily to WS_EXPORTS.
  - A portal receipt and the authority request for more information remain in WS_PMT_SUBMISSIONS_RESPONSES.
  - The final environmental approval document is stored in WS_PMT_PERMITS_LICENSES.
prohibited_patterns:
- filing_master_records_directly_into_99_EXPORTS
- creating_counterparty_subfolder_trees_under_workstreams
- creating_phase_first_project_trees
- leaving_exact_duplicates_in_parallel_live_locations
- bypassing_canonical_filename_builder
audit_log_contract:
  required_fields:
  - source_path
  - proposed_folder_id
  - canonical_filename
  - confidence
  - requires_review
  - exception_class
  - duplicate_group_id
  - action_taken
  - timestamp
governance_integrity_checks:
- every_exception_target_folder_id_must_exist_in_special_asset_folders_or_workstreams
- path_policy_source_of_truth_ref_must_point_to_constraints
- route_output_contract_must_match_canonical_record_contract
non_goals:
- Do not create phase-first trees.
- Do not create counterparty subfolder hierarchies under workstreams.
- Do not allow uncontrolled custom subfolders in canonical storage.
- Do not use 99_EXPORTS as the final canonical home.
generation:
  generated_files:
  - core_policy.generated.yaml
  - routing_policy.generated.yaml
  - governance_policy.generated.yaml
  authority_rule: Only master_policy.yaml is maintained by humans. Generated files must not be edited by hand.
master_data_rules:
  company_master:
    company_id:
      autogenerated: true
      prefix: CMP
      format: CMP-0001
    display_name:
      required: true
      description: Human-friendly company name.
    company_root_path:
      required: false
      description: Filesystem path before COMPANY_FOLDER used for total path-length checking and real storage location.
    namecode:
      autogenerated: true
      allowed_chars: letters_only
      case: uppercase
      max_length: 6
      source: display_name_or_user_input
    typ3:
      input_mode: dropdown_from_legal_types_json
      required: true
      provisional_fallback: OTH
    vat9:
      required: true
      format: 9_digits_zero_padded
    company_folder:
      autogenerated: true
      pattern: '{NAMECODE}-{TYP3}-{VAT9}'
    relationship_to_group:
      required: false
      enum_ref: enums.relationship_to_group
      description: Relationship of the company to the SCH group. Use THIRD_PARTY for externally owned assets that SCH manages.
    record_status:
      required: false
      enum_ref: enums.master_record_statuses
      description: CANONICAL for fully confirmed master data; PROVISIONAL for records created from operational evidence pending
        legal-name confirmation.
  asset_master:
    asset_id:
      autogenerated: true
      prefix: AST
      format: AST-0001
    company_id:
      input_mode: dropdown_from_company_master
      required: true
    type:
      input_mode: dropdown_from_asset_types_json
      required: true
    metric:
      autogenerated: true
      source: calculated_from_type_input_value_and_input_unit
    project_name:
      required: true
      case: lowercase
    location:
      required: true
      case: uppercase
    typeid:
      autogenerated: true
      pattern: '{TYPE}{METRIC}-{SS}'
    asset_folder:
      autogenerated: true
      pattern: '{TYPEID}_{PROJECT_NAME}_{LOCATION}'
    management_scope:
      required: false
      enum_ref: enums.management_scopes
      description: Operational scope of SCH over the asset. Use O_M_only for externally owned assets where SCH performs operations
        and maintenance only.
    ownership_model:
      required: false
      enum_ref: enums.ownership_models
      description: Ownership and operator model for the asset record.
managed_external_assets:
  rule_id: THIRD_PARTY_OWNED_SCH_OPERATED
  intent:
  - If SCH operates a third-party-owned asset, keep the canonical asset under the owner company root using the normal company
    folder pattern.
  - 'Add the owner company to company_master with relationship_to_group: THIRD_PARTY when it is not already present.'
  - 'Mark the asset record with management_scope: O_M_only when the managed scope is limited to operations and maintenance.'
  - Do not create a mirrored canonical asset tree under SCHELL for the same physical asset.
  - Keep SCH operator information in metadata, contracts, and finance records rather than changing the company-folder backbone.
  provisional_legal_type_handling:
    when_source_legal_type_is_unknown_or_nonstandard: 'Use typ3: OTH, preserve the raw source type in source_type_std, and
      keep a validation flag until confirmed.'
