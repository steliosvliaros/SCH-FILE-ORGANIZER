    code: EXPORTS
    label: Exports
    root_folder:
      id: WS_EXPORTS
      name: 99_EXPORTS
      path_template: '{ASSET_ROOT}/99_EXPORTS'
    misc_review_folder: null
    subfolders: {}
dynamic_selectors:
  same_workstream_misc_review:
    description: Resolve to the 99_MISC_REVIEW folder under the same workstream as the proposed canonical route.
  same_workstream_root:
    description: Resolve to the root folder of the same workstream as the proposed canonical route.
