schema:
  schema_id: sch.fileserver.master
  schema_version: 3.1.0
  status: production_master
  role: single_source_of_truth
  file_name: master_policy.yaml
policy:
  name: SCH Master File Server Policy
  design_intent:
  - Keep company folder, asset folder, TYPEID, and filename backbone stable.
  - Keep workstream as the physical filing axis.
  - Keep phase in filename and metadata, not as the main folder axis.
  - Keep daily filing decisions simple.
  - Keep FIN and CNT counterparties in filename and metadata, not in deep folder trees.
  - Use one master policy as the only maintained source, and generate derived policy views automatically.
  - Allow third-party owner companies in company_master when SCH operates assets on behalf of others without changing the
    company folder backbone.
patterns:
  company_folder: '{NAMECODE}-{TYP3}-{VAT9}'
  asset_folder: '{TYPEID}_{PROJECT_NAME}_{LOCATION}'
  typeid: '{TYPE}{METRIC}-{SS}'
  internal_filename: '{TYPEID}_{PHASE}_{DOCTYPE}_{DESCRIPTION}_{DATE}_{VERSION}_{STATUS}.{EXT}'
  portable_export_filename: '{COMPANY_FOLDER}_{INTERNAL_FILENAME}'
constraints:
  max_full_path_chars: 240
  max_filename_chars: 120
  max_foldername_chars: 64
  max_depth_segments: 12
asset_status_files:
- _STATUS_01_PIPELINE.txt
- _STATUS_02_UNDER_DEVELOPMENT.txt
- _STATUS_03_UNDER_CONSTRUCTION.txt
- _STATUS_04_OPERATIONAL.txt
